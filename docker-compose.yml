# SkyBooker MVP (Phase 1) — local orchestration.
#
# Bring everything up with:     docker compose up --build
# Tear everything down with:    docker compose down -v    (the `-v` also drops the DB volume)

services:
  postgres:
    image: postgres:16-alpine
    container_name: skybooker-db
    environment:
      POSTGRES_DB: ${DB_NAME:-skybooker}
      POSTGRES_USER: ${DB_USER:-skybooker}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-skybooker}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-skybooker} -d ${DB_NAME:-skybooker}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skybooker-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-skybooker}
      DB_USER: ${DB_USER:-skybooker}
      DB_PASSWORD: ${DB_PASSWORD:-skybooker}
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-please-override-in-prod-at-least-32-bytes-1234567890}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
