spring:
  application:
    name: skybooker-api
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/skybooker
    username: ${DB_USERNAME:skybooker}
    password: ${DB_PASSWORD:skybooker}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-for-development-only-change-in-production}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_xxxx}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_xxxx}

skybooker:
  integrations:
    amadeus:
      enabled: ${AMADEUS_ENABLED:false}
      base-url: ${AMADEUS_BASE_URL:https://test.api.amadeus.com}
      api-key: ${AMADEUS_API_KEY:}
      api-secret: ${AMADEUS_API_SECRET:}
    ai:
      enabled: ${AI_ENABLED:false}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
      max-tokens: 1200
    unsplash:
      enabled: ${UNSPLASH_ENABLED:false}
      base-url: ${UNSPLASH_BASE_URL:https://api.unsplash.com}
      access-key: ${UNSPLASH_ACCESS_KEY:}
    ticketmaster:
      enabled: ${TICKETMASTER_ENABLED:false}
      base-url: ${TICKETMASTER_BASE_URL:https://app.ticketmaster.com/discovery/v2}
      api-key: ${TICKETMASTER_API_KEY:}
    opentripmap:
      enabled: ${OPENTRIPMAP_ENABLED:false}
      base-url: ${OPENTRIPMAP_BASE_URL:https://api.opentripmap.com/0.1}
      api-key: ${OPENTRIPMAP_API_KEY:}
    wikipedia:
      enabled: ${WIKIPEDIA_ENABLED:true}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
