spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:skybooker}
    username: ${DB_USER:skybooker}
    password: ${DB_PASSWORD:skybooker}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # NE JAMAIS utiliser cette valeur en production — override via la variable d'env JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-jwt-secret-please-change-me-with-at-least-32-bytes-of-entropy-0123456789}

logging:
  level:
    root: INFO
    com.skybooker: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
