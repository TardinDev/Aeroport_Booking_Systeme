name: CI / Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    # GitHub-hosted Ubuntu runners already expose a Docker daemon,
    # so Testcontainers picks it up automatically for BookingIntegrationTest.

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, run tests and package
        run: mvn -B -ntp clean verify

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: skybooker-api-jar
          path: backend/target/skybooker-api-*.jar
          if-no-files-found: error
          retention-days: 7
